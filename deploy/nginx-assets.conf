# Asset Vite có tên hash: phục vụ trực tiếp, cache lâu và ưu tiên bản .gz đã build sẵn.
location ^~ /assets/ {
    root /var/www/pdftools/.deploy/current/dist;
    try_files $uri =404;
    gzip_static on;
    access_log off;

    types {
        text/css css;
        text/javascript js mjs;
        application/json json;
        application/wasm wasm;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        font/woff2 woff2;
    }
    default_type application/octet-stream;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Vary "Accept-Encoding" always;
    add_header X-Content-Type-Options "nosniff" always;
}
