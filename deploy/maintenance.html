<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#4f46e5" />
    <meta http-equiv="refresh" content="15" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='18' fill='%234f46e5'/%3E%3Cpath d='M20 13a5 5 0 0 1 5-5h15l9 9v25a5 5 0 0 1-5 5H25a5 5 0 0 1-5-5V13Z' fill='white'/%3E%3Cpath d='M27 25h15M27 31h12M27 37h8' fill='none' stroke='%234f46e5' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>PDFTools đang cập nhật</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        color: #17182d;
        background:
          radial-gradient(circle at 18% 20%, rgba(99, 102, 241, .18), transparent 34rem),
          radial-gradient(circle at 85% 82%, rgba(34, 211, 238, .13), transparent 30rem),
          #f6f7fb;
      }
      main {
        width: min(640px, calc(100% - 32px));
        padding: clamp(32px, 6vw, 58px);
        text-align: center;
        border: 1px solid rgba(99, 102, 241, .18);
        border-radius: 30px;
        background: rgba(255, 255, 255, .88);
        box-shadow: 0 28px 80px rgba(49, 46, 129, .14);
        backdrop-filter: blur(18px);
      }
      .logo {
        width: 82px;
        height: 82px;
        margin: 0 auto 28px;
        filter: drop-shadow(0 14px 20px rgba(79, 70, 229, .25));
      }
      .eyebrow {
        margin: 0 0 12px;
        color: #4f46e5;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: clamp(30px, 6vw, 44px); line-height: 1.1; letter-spacing: -.04em; }
      .description { max-width: 480px; margin: 18px auto 0; color: #62667b; font-size: 17px; line-height: 1.7; }
      .status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        width: fit-content;
        margin: 28px auto 0;
        padding: 11px 16px;
        color: #3730a3;
        font-size: 14px;
        font-weight: 750;
        border-radius: 999px;
        background: #eef2ff;
      }
      .dots { display: inline-flex; gap: 4px; }
      .dots i { width: 6px; height: 6px; border-radius: 50%; background: #6366f1; animation: pulse 1.2s infinite ease-in-out; }
      .dots i:nth-child(2) { animation-delay: .15s; }
      .dots i:nth-child(3) { animation-delay: .3s; }
      .countdown { margin: 20px 0 0; color: #7b7f92; font-size: 14px; }
      button {
        min-height: 48px;
        margin-top: 24px;
        padding: 0 24px;
        border: 0;
        border-radius: 14px;
        color: white;
        background: linear-gradient(135deg, #6366f1, #4338ca);
        box-shadow: 0 12px 24px rgba(79, 70, 229, .23);
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }
      button:hover { transform: translateY(-1px); }
      button:focus-visible { outline: 3px solid rgba(99, 102, 241, .35); outline-offset: 4px; }
      footer { margin-top: 30px; color: #9295a5; font-size: 13px; }
      @keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
      @media (prefers-color-scheme: dark) {
        body { color: #f4f5ff; background: radial-gradient(circle at 18% 20%, rgba(99, 102, 241, .25), transparent 34rem), radial-gradient(circle at 85% 82%, rgba(34, 211, 238, .12), transparent 30rem), #0d1020; }
        main { border-color: #303654; background: rgba(20, 24, 45, .9); box-shadow: 0 28px 80px rgba(0, 0, 0, .32); }
        .eyebrow { color: #a5b4fc; }
        .description { color: #b6bbd0; }
        .status { color: #c7d2fe; background: #242750; }
        .countdown, footer { color: #959bb4; }
      }
      @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .7; } button:hover { transform: none; } }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="PDFTools">
        <defs>
          <linearGradient id="background" x1="10" y1="7" x2="55" y2="59" gradientUnits="userSpaceOnUse"><stop stop-color="#7772ff"/><stop offset=".52" stop-color="#4f46e5"/><stop offset="1" stop-color="#312e81"/></linearGradient>
          <linearGradient id="spark" x1="40" y1="37" x2="53" y2="51" gradientUnits="userSpaceOnUse"><stop stop-color="#a5f3fc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
        </defs>
        <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#background)"/>
        <path d="M15 18.5a5 5 0 0 1 5-5h18l8 8v24a5 5 0 0 1-5 5H20a5 5 0 0 1-5-5v-27Z" fill="#a5f3fc" opacity=".32"/>
        <path d="M20 13a5 5 0 0 1 5-5h15l9 9v25a5 5 0 0 1-5 5H25a5 5 0 0 1-5-5V13Z" fill="#fff"/>
        <path d="M40 8v7a4 4 0 0 0 4 4h5" fill="#c7d2fe"/>
        <path d="M27 25h15M27 31h12M27 37h8" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
        <path d="m46 36 1.7 4.3L52 42l-4.3 1.7L46 48l-1.7-4.3L40 42l4.3-1.7L46 36Z" fill="url(#spark)" stroke="#312e81" stroke-width="1.25"/>
      </svg>
      <p class="eyebrow">PDFTools · Đang bảo trì</p>
      <h1>Chúng tôi đang cập nhật</h1>
      <p class="description">Một phiên bản mới đang được đưa lên hệ thống. Website sẽ hoạt động trở lại ngay sau khi kiểm tra hoàn tất.</p>
      <div class="status" role="status"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span> Đang hoàn tất cập nhật</div>
      <p class="countdown">Tự động thử lại sau <strong id="seconds">15</strong> giây</p>
      <button type="button" onclick="location.reload()">Thử tải lại ngay</button>
      <footer>PDFTools · Phát triển bởi Danh Phạm</footer>
    </main>
    <script>
      let seconds = 15;
      const value = document.getElementById('seconds');
      window.setInterval(() => { seconds = Math.max(0, seconds - 1); value.textContent = String(seconds); }, 1000);
    </script>
  </body>
</html>
