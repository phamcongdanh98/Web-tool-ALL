# Trang độc lập được Nginx trả về khi bật cờ bảo trì hoặc Express chưa healthy.
error_page 502 503 504 =503 /_pdftools_maintenance.html;

location = /_pdftools_maintenance.html {
    internal;
    alias /var/www/pdftools/.deploy/maintenance.html;

    add_header Retry-After "15" always;
    add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;
}
